services:
  firebase:
    build:
      context: .
      dockerfile: docker/firebase-emulator.Dockerfile
    working_dir: /firebase
    volumes:
      - ./firebase:/firebase
      - ./firebase.json:/firebase.json:ro
    env_file:
      - .env
    ports:
      - "14000:14000" # Emulator UI
      - "18080:18080" # Firestore
      - "19099:19099" # Auth
      - "19199:19199" # Storage
    command: >
      sh -c "firebase emulators:start --only firestore,auth,storage --project $$VITE_PROJECT_ID
      --config /firebase.json"
